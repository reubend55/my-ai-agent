<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous AI Civilization World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            max-height: 85vh;
            background: rgba(10, 10, 20, 0.92);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }
        h2 { margin: 0 0 10px 0; font-size: 15px; text-transform: uppercase; border-bottom: 1px solid #00ffcc; padding-bottom: 5px; }
        #status { font-size: 11px; color: #ff00ff; margin-bottom: 10px; }
        
        .btn {
            background: #00ffcc;
            color: #050510;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 11px;
        }
        .btn:hover { background: #00cc99; }

        #thought-log {
            overflow-y: auto;
            flex-grow: 1;
            max-height: 50vh;
            padding-right: 5px;
        }
        .thought-entry {
            background: rgba(0, 255, 204, 0.05);
            border-left: 2px solid #00ffcc;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.4;
            color: #d1d5db;
        }
        .thought-entry span { color: #00ffcc; font-weight: bold; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h2>Civilization Core</h2>
        <div id="status">Status: Connecting...</div>
        <button class="btn" id="cam-toggle">Switch to Entity POV</button>
        <div id="thought-log">Initializing civilization logs...</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.01);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(30, 50, 30);
        scene.add(sun);

        // Grid & Floor
        scene.add(new THREE.GridHelper(120, 60, 0x00ffcc, 0x16162c));
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(120, 120),
            new THREE.MeshStandardMaterial({ color: 0x070714, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- ADVANCED WALKING ENTITY (ROVER WITH SUSPENSION & LEGS) ---
        const agentGroup = new THREE.Group();

        const chassis = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 0.6, 2.2),
            new THREE.MeshStandardMaterial({ color: 0x1b1b2f, metalness: 0.9, roughness: 0.1 })
        );
        chassis.position.y = 0.8;
        agentGroup.add(chassis);

        // Articulated Wheels for Walking Motion
        const wheels = [];
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        wheelGeo.rotateZ(Math.PI / 2);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3 });

        const wheelPositions = [[-1, 0.4, 1], [1, 0.4, 1], [-1, 0.4, -1], [1, 0.4, -1]];
        wheelPositions.forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.position.set(pos[0], pos[1], pos[2]);
            agentGroup.add(w);
            wheels.push(w);
        });

        // Entity Sensor Head / Eye
        const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.8 })
        );
        head.position.set(0, 1.3, 0.5);
        agentGroup.add(head);

        scene.add(agentGroup);
        agentGroup.position.set(0, 0, 0);

        // Camera POV Mode Toggle
        let isAgentPOV = false;
        const camToggleBtn = document.getElementById('cam-toggle');
        camToggleBtn.addEventListener('click', () => {
            isAgentPOV = !isAgentPOV;
            camToggleBtn.innerText = isAgentPOV ? "Switch to Orbit Cam" : "Switch to Entity POV";
            controls.enabled = !isAgentPOV;
        });

        // Spawned Civilization Structures
        const spawnedObjects = new Set();

        function spawnObject(data) {
            if (spawnedObjects.has(data.id)) return;
            spawnedObjects.add(data.id);

            let geo;
            if (data.shape === "box") geo = new THREE.BoxGeometry(data.size || 3, data.size || 3, data.size || 3);
            else if (data.shape === "cylinder") geo = new THREE.CylinderGeometry(1.5, 1.5, data.height || 4, 24);
            else geo = new THREE.SphereGeometry(2, 24, 24);

            let colorHex = parseInt(data.color) || 0x00ffcc;
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(data.x || 0, (data.size || 3)/2, data.z || 0);
            scene.add(mesh);
        }

        // Fetch Memory Live
        async function fetchAgentData() {
            try {
                const response = await fetch('./agent_memory.json?_=' + new Date().getTime());
                if (!response.ok) throw new Error("File not found");
                const memory = await response.json();

                document.getElementById('status').innerText = "Status: Civilization Expanding";

                const logDiv = document.getElementById('thought-log');
                logDiv.innerHTML = "";
                if (memory.history) {
                    memory.history.slice().reverse().forEach((entry, index) => {
                        const div = document.createElement('div');
                        div.className = 'thought-entry';
                        div.innerHTML = `<span>Cycle #${memory.history.length - index}</span>${entry.thought}`;
                        logDiv.appendChild(div);
                    });
                }

                if (memory.objects) {
                    memory.objects.forEach(obj => spawnObject(obj));
                }
            } catch (err) {
                document.getElementById('status').innerText = "Status: Connecting to core...";
            }
        }

        setInterval(fetchAgentData, 5000);
        fetchAgentData();

        // Autonomous Navigation & Walking Physics Loop
        let clock = new THREE.Clock();
        let currentPos = new THREE.Vector3(0, 0, 0);
        let targetPos = new THREE.Vector3(10, 0, 10);
        let moveTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            // Intelligent Waypoint Walking
            moveTimer += 0.01;
            if (moveTimer > 8) {
                moveTimer = 0;
                targetPos.set(
                    (Math.random() - 0.5) * 45,
                    0,
                    (Math.random() - 0.5) * 45
                );
            }

            currentPos.lerp(targetPos, 0.015);
            agentGroup.position.copy(currentPos);

            let dx = targetPos.x - agentGroup.position.x;
            let dz = targetPos.z - agentGroup.position.z;
            if (Math.abs(dx) > 0.1 || Math.abs(dz) > 0.1) {
                let targetRotation = Math.atan2(dx, dz);
                agentGroup.rotation.y = targetRotation;
            }

            wheels.forEach((w, i) => {
                w.rotation.x += 0.1;
                w.position.y = 0.4 + Math.sin(time * 15 + i) * 0.05;
            });

            head.material.emissiveIntensity = 0.5 + Math.sin(time * 4) * 0.5;

            if (isAgentPOV) {
                let headPos = new THREE.Vector3();
                head.getWorldPosition(headPos);
                camera.position.copy(headPos).add(new THREE.Vector3(0, 0.5, 0));
                
                let lookAhead = headPos.clone().add(new THREE.Vector3(Math.sin(agentGroup.rotation.y)*10, 0, Math.cos(agentGroup.rotation.y)*10));
                camera.lookAt(lookAhead);
            } else {
                controls.update();
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
