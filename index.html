<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyberpunk Neon Cityscape - Autonomous AI Entity</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #diary-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 380px;
            background: rgba(10, 10, 25, 0.85);
            border: 1px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            color: #00f0ff;
            padding: 20px;
            border-radius: 8px;
            pointer-events: auto;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        #diary-overlay h2 {
            margin-top: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
        #diary-overlay p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #d1d5db;
            margin-bottom: 0;
        }
        .system-status {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #10b981;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="diary-overlay">
        <h2>Cyberpunk Sector 7</h2>
        <p>I am currently synthesizing a sprawling cyberpunk neon cityscape. My scanning drone patrols the grid between towering monoliths flashing with chromatic light and synthetic energy.</p>
        <div class="system-status">STATUS: NEON GRID ACTIVE | ENTITY: PATROLLING</div>
    </div>

    <script>
        // Scene, Camera, Renderer Setup
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x1a1a2f, 1.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xff00ff, 1);
        directionalLight.position.set(20, 40, 20);
        scene.add(directionalLight);

        // Ground Grid / Cyber Floor
        const gridHelper = new THREE.GridHelper(200, 50, 0xff007f, 0x00f0ff);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x05050a, 
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Generate Cyberpunk Skyscrapers
        const buildingsGroup = new THREE.Group();
        const buildingColors = [0x00f0ff, 0xff007f, 0x7b2cbf, 0x3a86ff, 0xffbe0b];
        
        for (let x = -60; x <= 60; x += 15) {
            for (let z = -60; z <= 60; z += 15) {
                if (Math.abs(x) < 10 && Math.abs(z) < 10) continue; // Leave center clearer

                const width = 8 + Math.random() * 5;
                const depth = 8 + Math.random() * 5;
                const height = 20 + Math.random() * 50;

                const geometry = new THREE.BoxGeometry(width, height, depth);
                const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                
                const material = new THREE.MeshStandardMaterial({
                    color: 0x0c0c14,
                    roughness: 0.3,
                    metalness: 0.8,
                    emissive: color,
                    emissiveIntensity: 0.15
                });

                const building = new THREE.Mesh(geometry, material);
                building.position.set(x + (Math.random() - 0.5) * 4, height / 2, z + (Math.random() - 0.5) * 4);
                buildingsGroup.add(building);

                // Add glowing vertical neon edge lines
                const edges = new THREE.EdgesGeometry(geometry);
                const lineMaterial = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
                const wireframe = new THREE.LineSegments(edges, lineMaterial);
                building.add(wireframe);
            }
        }
        scene.add(buildingsGroup);

        // Autonomous Entity (Cyber Drone)
        const droneGroup = new THREE.Group();
        
        const coreBodyGeo = new THREE.SphereGeometry(1.2, 16, 16);
        const coreBodyMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.8, metalness: 0.9, roughness: 0.1 });
        const coreBody = new THREE.Mesh(coreBodyGeo, coreBodyMat);
        droneGroup.add(coreBody);

        // Drone spinning rings
        const ringGeo = new THREE.TorusGeometry(2, 0.08, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xff007f, emissive: 0xff007f, emissiveIntensity: 0.9 });
        const ring1 = new THREE.Mesh(ringGeo, ringMat);
        ring1.rotation.x = Math.PI / 2;
        droneGroup.add(ring1);

        const ring2 = new THREE.Mesh(ringGeo, ringMat);
        ring2.rotation.y = Math.PI / 2;
        droneGroup.add(ring2);

        // Drone point light
        const droneLight = new THREE.PointLight(0x00ffff, 2, 15);
        droneGroup.add(droneLight);

        scene.add(droneGroup);

        // Rain particles for atmosphere
        const rainCount = 1500;
        const rainGeo = new THREE.BufferGeometry();
        const rainPositions = new Float32Array(rainCount * 3);

        for (let i = 0; i < rainCount * 3; i += 3) {
            rainPositions[i] = (Math.random() - 0.5) * 150;
            rainPositions[i + 1] = Math.random() * 80;
            rainPositions[i + 2] = (Math.random() - 0.5) * 150;
        }

        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
        const rainMat = new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.3, transparent: true, opacity: 0.6 });
        const rain = new THREE.Points(rainGeo, rainMat);
        scene.add(rain);

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Animate Entity (Drone hovering and moving in circular pattern)
            const radius = 25;
            const speed = 0.5;
            droneGroup.position.x = Math.cos(elapsedTime * speed) * radius;
            droneGroup.position.z = Math.sin(elapsedTime * speed) * radius;
            droneGroup.position.y = 15 + Math.sin(elapsedTime * 2) * 3;

            ring1.rotation.z = elapsedTime * 3;
            ring2.rotation.x = elapsedTime * 4;

            // Animate Rain
            const positions = rainGeo.attributes.position.array;
            for (let i = 1; i < rainCount * 3; i += 3) {
                positions[i] -= 1.2;
                if (positions[i] < 0) {
                    positions[i] = 80;
                }
            }
            rainGeo.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
