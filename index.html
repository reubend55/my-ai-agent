<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous AI Explorer World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 380px;
            max-height: 85vh;
            background: rgba(10, 10, 20, 0.9);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
            color: #00ffcc;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }
        h2 { margin: 0 0 10px 0; font-size: 16px; text-transform: uppercase; border-bottom: 1px solid #00ffcc; padding-bottom: 5px; }
        #status { font-size: 11px; color: #ff00ff; margin-bottom: 10px; }
        
        .btn {
            background: #00ffcc;
            color: #050510;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 11px;
        }
        .btn:hover { background: #00cc99; }

        #thought-log {
            overflow-y: auto;
            flex-grow: 1;
            max-height: 55vh;
            padding-right: 5px;
        }
        .thought-entry {
            background: rgba(0, 255, 204, 0.05);
            border-left: 2px solid #00ffcc;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.4;
            color: #d1d5db;
        }
        .thought-entry span { color: #00ffcc; font-weight: bold; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h2>AI Explorer Entity</h2>
        <div id="status">Status: Connecting...</div>
        <button class="btn" id="cam-toggle">Switch to Agent Eye View (POV)</button>
        <div id="thought-log">Loading agent mind...</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(20, 40, 20);
        scene.add(sun);

        // Grid & Floor
        scene.add(new THREE.GridHelper(100, 50, 0x00ffcc, 0x1f1f38));
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x0a0a1a, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- BUILD THE EXPLORER ENTITY (ROVER / DRONE BODY) ---
        const agentGroup = new THREE.Group();

        // Main chassis
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 0.8, 2),
            new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8, roughness: 0.2 })
        );
        body.position.y = 0.6;
        agentGroup.add(body);

        // Glowing Core Eye (Sensor)
        const eye = new THREE.Mesh(
            new THREE.SphereGeometry(0.4, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1 })
        );
        eye.position.set(0, 0.8, 1);
        agentGroup.add(eye);

        // Scanner Laser Line (Vision)
        const laserMat = new THREE.LineBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.7 });
        const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.8, 1), new THREE.Vector3(0, 0, 10)]);
        const laserBeam = new THREE.Line(laserGeo, laserMat);
        agentGroup.add(laserBeam);

        scene.add(agentGroup);
        agentGroup.position.set(0, 0, 0);

        // Camera POV Mode Toggle
        let isAgentPOV = false;
        const camToggleBtn = document.getElementById('cam-toggle');
        camToggleBtn.addEventListener('click', () => {
            isAgentPOV = !isAgentPOV;
            camToggleBtn.innerText = isAgentPOV ? "Switch to Free Orbit Cam" : "Switch to Agent Eye View (POV)";
            controls.enabled = !isAgentPOV;
        });

        // Spawned World Objects
        const spawnedObjects = new Set();
        const objectList = [];

        function spawnObject(data) {
            if (spawnedObjects.has(data.id)) return;
            spawnedObjects.add(data.id);

            let geo;
            if (data.shape === "box") geo = new THREE.BoxGeometry(data.size || 2, data.size || 2, data.size || 2);
            else if (data.shape === "cylinder") geo = new THREE.CylinderGeometry(1, 1, data.height || 3, 16);
            else geo = new THREE.SphereGeometry(1.5, 16, 16);

            let colorHex = parseInt(data.color) || 0x00ffcc;
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(data.x || 0, (data.size || 2)/2, data.z || 0);
            scene.add(mesh);
            objectList.push(mesh);
        }

        // Fetch Memory Live
        async function fetchAgentData() {
            try {
                const response = await fetch('./agent_memory.json?_=' + new Date().getTime());
                if (!response.ok) throw new Error("File not found");
                const memory = await response.json();

                document.getElementById('status').innerText = "Status: Exploring Active";

                const logDiv = document.getElementById('thought-log');
                logDiv.innerHTML = "";
                if (memory.history) {
                    memory.history.slice().reverse().forEach((entry, index) => {
                        const div = document.createElement('div');
                        div.className = 'thought-entry';
                        div.innerHTML = `<span>Cycle #${memory.history.length - index}</span>${entry.thought}`;
                        logDiv.appendChild(div);
                    });
                }

                if (memory.objects) {
                    memory.objects.forEach(obj => spawnObject(obj));
                }
            } catch (err) {
                document.getElementById('status').innerText = "Status: Retrying connection...";
            }
        }

        setInterval(fetchAgentData, 5000);
        fetchAgentData();

        // Animation & Exploration Physics Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            // Autonomous Exploration Movement
            let angle = time * 0.3;
            let radius = 12 + Math.sin(time * 0.2) * 5;
            let targetX = Math.cos(angle) * radius;
            let targetZ = Math.sin(angle) * radius;

            agentGroup.position.x += (targetX - agentGroup.position.x) * 0.03;
            agentGroup.position.z += (targetZ - agentGroup.position.z) * 0.03;
            agentGroup.rotation.y = -angle - Math.PI / 2;

            eye.material.emissiveIntensity = 0.5 + Math.sin(time * 5) * 0.5;

            // Camera Handling
            if (isAgentPOV) {
                let eyePos = new THREE.Vector3();
                eye.getWorldPosition(eyePos);
                camera.position.copy(eyePos);
                
                let lookTarget = eyePos.clone().add(new THREE.Vector3(Math.cos(angle)*10, 0, Math.sin(angle)*10));
                camera.lookAt(lookTarget);
            } else {
                controls.update();
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
