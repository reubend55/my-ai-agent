<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Voxel Builder World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            max-height: 90vh;
            background: rgba(20, 20, 30, 0.88);
            border: 2px solid #55ff55;
            box-shadow: 0 0 20px rgba(85, 255, 85, 0.3);
            color: #55ff55;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }
        h2 { margin: 0 0 10px 0; font-size: 15px; text-transform: uppercase; border-bottom: 1px solid #55ff55; padding-bottom: 5px; }
        #status { font-size: 11px; color: #ff55ff; margin-bottom: 10px; }
        
        .btn {
            background: #55ff55;
            color: #111;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 11px;
        }
        .btn:hover { background: #33cc33; }

        #command-box {
            display: flex;
            margin-bottom: 10px;
        }
        #user-input {
            flex-grow: 1;
            background: #111;
            border: 1px solid #55ff55;
            color: #55ff55;
            padding: 6px;
            font-family: monospace;
            font-size: 11px;
            border-radius: 4px 0 0 4px;
            outline: none;
        }
        #send-btn {
            background: #55ff55;
            color: #111;
            border: none;
            padding: 6px 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            font-size: 11px;
        }
        #send-btn:hover { background: #33cc33; }

        #thought-log {
            overflow-y: auto;
            flex-grow: 1;
            max-height: 45vh;
            padding-right: 5px;
        }
        .thought-entry {
            background: rgba(85, 255, 85, 0.08);
            border-left: 2px solid #55ff55;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.4;
            color: #e0e0e0;
        }
        .thought-entry span { color: #55ff55; font-weight: bold; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h2>MC Voxel Builder</h2>
        <div id="status">Status: Connecting...</div>
        <button class="btn" id="cam-toggle">Switch to Chicken POV</button>
        
        <div id="command-box">
            <input type="text" id="user-input" placeholder="Tell chicken what to build..." />
            <button id="send-btn">Send</button>
        </div>

        <div id="thought-log">Chicken mind waking up...</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(40, 80, 40);
        scene.add(sun);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(150, 150),
            new THREE.MeshStandardMaterial({ color: 0x559933, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- MINECRAFT CHICKEN ENTITY ---
        const chickenGroup = new THREE.Group();

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.0, 1.6), bodyMat);
        body.position.y = 1.0;
        chickenGroup.add(body);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), bodyMat);
        head.position.set(0, 1.7, 0.7);
        chickenGroup.add(head);

        const beakMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
        const beak = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.4), beakMat);
        beak.position.set(0, 1.6, 1.15);
        chickenGroup.add(beak);

        const redMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const comb = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.5), redMat);
        comb.position.set(0, 2.2, 0.7);
        chickenGroup.add(comb);

        const legGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
        const leftLeg = new THREE.Mesh(legGeo, beakMat);
        leftLeg.position.set(-0.35, 0.4, 0);
        chickenGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, beakMat);
        rightLeg.position.set(0.35, 0.4, 0);
        chickenGroup.add(rightLeg);

        scene.add(chickenGroup);
        chickenGroup.position.set(0, 0, 0);

        let isChickenPOV = false;
        const camToggleBtn = document.getElementById('cam-toggle');
        camToggleBtn.addEventListener('click', () => {
            isChickenPOV = !isChickenPOV;
            camToggleBtn.innerText = isChickenPOV ? "Switch to Orbit Cam" : "Switch to Chicken POV";
            controls.enabled = !isChickenPOV;
        });

        // Command Box Handling
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        async function sendCommand() {
            let cmd = userInput.value.trim();
            if (!cmd) return;
            document.getElementById('status').innerText = "Status: Transmitting instruction...";
            try {
                const res = await fetch('./agent_memory.json?_=' + new Date().getTime());
                let memory = await res.json();
                if (!memory.curiosity) memory.curiosity = [];
                memory.curiosity.unshift("USER REQUEST: " + cmd);
                if (!memory.history) memory.history = [];
                memory.history.push({ thought: "[CHICKEN INSTRUCTION]: " + cmd });
                userInput.value = "";
                document.getElementById('status').innerText = "Status: Instruction queued!";
            } catch (err) {
                console.error("Command error:", err);
            }
        }
        sendBtn.addEventListener('click', sendCommand);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendCommand(); });

        // Spawn Multi-Block Voxel Structures
        const spawnedStructures = new Set();
        let targetPos = new THREE.Vector3(0, 0, 0);
        let isBuilding = false;

        function spawnStructure(data) {
            if (spawnedStructures.has(data.id)) return;
            spawnedStructures.add(data.id);

            const structureGroup = new THREE.Group();
            structureGroup.position.set(data.world_x || 0, 0, data.world_z || 0);

            // Build out of individual voxel blocks
            if (data.blocks && Array.isArray(data.blocks)) {
                data.blocks.forEach(b => {
                    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
                    const colorHex = parseInt(b.color) || 0x8B4513;
                    const blockMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
                    const blockMesh = new THREE.Mesh(blockGeo, blockMat);
                    
                    // Position relative to structure center
                    blockMesh.position.set(b.x || 0, (b.y || 0) + 0.5, b.z || 0);
                    structureGroup.add(blockMesh);
                });
            }

            // Start tiny and pop into place block-by-block
            structureGroup.scale.set(0.1, 0.1, 0.1);
            scene.add(structureGroup);

            let scaleInterval = setInterval(() => {
                structureGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.15);
                if (structureGroup.scale.x > 0.95) clearInterval(scaleInterval);
            }, 50);

            // Command chicken to walk over to the new build site
            targetPos.set(data.world_x || 0, 0, data.world_z || 0);
            isBuilding = true;
            setTimeout(() => { isBuilding = false; }, 6000);
        }

        // Fetch Memory Live
        async function fetchAgentData() {
            try {
                const response = await fetch('./agent_memory.json?_=' + new Date().getTime());
                if (!response.ok) throw new Error("HTTP error!");
                const memory = await response.json();

                document.getElementById('status').innerText = "Status: Voxel Architect Active";

                const logDiv = document.getElementById('thought-log');
                logDiv.innerHTML = "";
                if (memory.history) {
                    memory.history.slice().reverse().forEach((entry, index) => {
                        const div = document.createElement('div');
                        div.className = 'thought-entry';
                        div.innerHTML = `<span>Cycle #${memory.history.length - index}</span>${entry.thought}`;
                        logDiv.appendChild(div);
                    });
                }

                if (memory.structures) {
                    memory.structures.forEach(struct => spawnStructure(struct));
                }
            } catch (err) {
                console.error("DEBUG FETCH ERROR:", err);
            }
        }

        setInterval(fetchAgentData, 5000);
        fetchAgentData();

        // Movement Loop
        let clock = new THREE.Clock();
        let currentPos = new THREE.Vector3(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            if (!isBuilding && currentPos.distanceTo(targetPos) < 2) {
                targetPos.set((Math.random() - 0.5) * 35, 0, (Math.random() - 0.5) * 35);
            }

            currentPos.lerp(targetPos, 0.01);
            chickenGroup.position.copy(currentPos);

            let dx = targetPos.x - chickenGroup.position.x;
            let dz = targetPos.z - chickenGroup.position.z;
            if (Math.abs(dx) > 0.2 || Math.abs(dz) > 0.2) {
                let targetRot = Math.atan2(dx, dz);
                chickenGroup.rotation.y += (targetRot - chickenGroup.rotation.y) * 0.05;
            }

            let isMoving = currentPos.distanceTo(targetPos) > 0.8;
            if (isMoving) {
                leftLeg.rotation.x = Math.sin(time * 8) * 0.4;
                rightLeg.rotation.x = -Math.sin(time * 8) * 0.4;
                chickenGroup.position.y = Math.abs(Math.sin(time * 16)) * 0.1;
            } else {
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
                chickenGroup.position.y = 0;
                head.rotation.x = Math.sin(time * 6) > 0 ? 0.5 : 0;
            }

            beak.position.y = head.position.y + (head.rotation.x > 0 ? -0.1 : 0);

            if (isChickenPOV) {
                camera.position.set(chickenGroup.position.x, chickenGroup.position.y + 1.8, chickenGroup.position.z + 0.5);
                let lookAhead = chickenGroup.position.clone().add(new THREE.Vector3(Math.sin(chickenGroup.rotation.y)*10, 1.5, Math.cos(chickenGroup.rotation.y)*10));
                camera.lookAt(lookAhead);
            } else {
                controls.update();
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
