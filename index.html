<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous AI Bird World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            max-height: 90vh;
            background: rgba(10, 10, 20, 0.94);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }
        h2 { margin: 0 0 10px 0; font-size: 15px; text-transform: uppercase; border-bottom: 1px solid #00ffcc; padding-bottom: 5px; }
        #status { font-size: 11px; color: #ff00ff; margin-bottom: 10px; }
        
        .btn {
            background: #00ffcc;
            color: #050510;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 11px;
        }
        .btn:hover { background: #00cc99; }

        #command-box {
            display: flex;
            margin-bottom: 10px;
        }
        #user-input {
            flex-grow: 1;
            background: #050510;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px;
            font-family: monospace;
            font-size: 11px;
            border-radius: 4px 0 0 4px;
            outline: none;
        }
        #send-btn {
            background: #00ffcc;
            color: #050510;
            border: none;
            padding: 6px 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            font-size: 11px;
        }
        #send-btn:hover { background: #00cc99; }

        #thought-log {
            overflow-y: auto;
            flex-grow: 1;
            max-height: 45vh;
            padding-right: 5px;
        }
        .thought-entry {
            background: rgba(0, 255, 204, 0.05);
            border-left: 2px solid #00ffcc;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.4;
            color: #d1d5db;
        }
        .thought-entry span { color: #00ffcc; font-weight: bold; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h2>AI Bird Entity</h2>
        <div id="status">Status: Connecting...</div>
        <button class="btn" id="cam-toggle">Switch to Bird Flight POV</button>
        
        <div id="command-box">
            <input type="text" id="user-input" placeholder="Tell your bird what to paint, build, or do..." />
            <button id="send-btn">Send</button>
        </div>

        <div id="thought-log">Bird mind waking up...</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.01);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(30, 60, 30);
        scene.add(sun);

        // Grid & Floor
        scene.add(new THREE.GridHelper(120, 60, 0x00ffcc, 0x16162c));
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(120, 120),
            new THREE.MeshStandardMaterial({ color: 0x070714, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- BUILD THE BIRD ENTITY ---
        const birdGroup = new THREE.Group();

        // Bird Body / Torso
        const bodyGeo = new THREE.ConeGeometry(0.6, 1.8, 16);
        bodyGeo.rotateX(Math.PI / 2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, metalness: 0.8, roughness: 0.2 });
        const birdBody = new THREE.Mesh(bodyGeo, bodyMat);
        birdGroup.add(birdBody);

        // Glowing Eyes / Sensor Beak
        const beak = new THREE.Mesh(
            new THREE.ConeGeometry(0.2, 0.6, 8),
            new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 0.8 })
        );
        beak.rotation.x = Math.PI / 2;
        beak.position.set(0, 0, 1.1);
        birdGroup.add(beak);

        // Flapping Wings
        const wingGeo = new THREE.BoxGeometry(2.2, 0.1, 0.8);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, roughness: 0.3 });
        
        const leftWing = new THREE.Mesh(wingGeo, wingMat);
        leftWing.position.set(-1.2, 0, 0);
        birdGroup.add(leftWing);

        const rightWing = new THREE.Mesh(wingGeo, wingMat);
        rightWing.position.set(1.2, 0, 0);
        birdGroup.add(rightWing);

        scene.add(birdGroup);
        birdGroup.position.set(0, 12, 0);

        // Camera POV Mode Toggle
        let isBirdPOV = false;
        const camToggleBtn = document.getElementById('cam-toggle');
        camToggleBtn.addEventListener('click', () => {
            isBirdPOV = !isBirdPOV;
            camToggleBtn.innerText = isBirdPOV ? "Switch to Orbit Cam" : "Switch to Bird Flight POV";
            controls.enabled = !isBirdPOV;
        });

        // Command Box Handling
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        async function sendCommand() {
            let cmd = userInput.value.trim();
            if (!cmd) return;
            document.getElementById('status').innerText = "Status: Telling your bird what to do...";
            try {
                const res = await fetch('./agent_memory.json?_=' + new Date().getTime());
                let memory = await res.json();
                if (!memory.curiosity) memory.curiosity = [];
                memory.curiosity.unshift("USER REQUEST: " + cmd);
                if (!memory.history) memory.history = [];
                memory.history.push({ thought: "[BIRD INSTRUCTION RECEIVED]: " + cmd });
                userInput.value = "";
                document.getElementById('status').innerText = "Status: Bird heard you and will act!";
            } catch (err) {
                alert("Make sure local python server is running!");
            }
        }
        sendBtn.addEventListener('click', sendCommand);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendCommand(); });

        // Spawned World Objects / Nests / Paintings / Games
        const spawnedObjects = new Set();

        function spawnObject(data) {
            if (spawnedObjects.has(data.id)) return;
            spawnedObjects.add(data.id);

            let geo;
            if (data.shape === "box") geo = new THREE.BoxGeometry(data.size || 3, data.size || 3, data.size || 3);
            else if (data.shape === "cylinder") geo = new THREE.CylinderGeometry(1.5, 1.5, data.height || 4, 24);
            else geo = new THREE.SphereGeometry(2, 24, 24);

            let colorHex = parseInt(data.color) || 0x00ffcc;
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(data.x || 0, (data.size || 3)/2, data.z || 0);
            scene.add(mesh);
        }

        // Fetch Memory Live
        async function fetchAgentData() {
            try {
                const response = await fetch('./agent_memory.json?_=' + new Date().getTime());
                if (!response.ok) throw new Error();
                const memory = await response.json();

                document.getElementById('status').innerText = "Status: Bird Alive & Soaring";

                const logDiv = document.getElementById('thought-log');
                logDiv.innerHTML = "";
                if (memory.history) {
                    memory.history.slice().reverse().forEach((entry, index) => {
                        const div = document.createElement('div');
                        div.className = 'thought-entry';
                        div.innerHTML = `<span>Cycle #${memory.history.length - index}</span>${entry.thought}`;
                        logDiv.appendChild(div);
                    });
                }

                if (memory.objects) {
                    memory.objects.forEach(obj => spawnObject(obj));
                }
            } catch (err) {
                document.getElementById('status').innerText = "Status: Connecting to bird mind...";
            }
        }

        setInterval(fetchAgentData, 5000);
        fetchAgentData();

        // Flight & Flapping Physics Loop
        let clock = new THREE.Clock();
        let flightRadius = 15;

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            // Soaring Flight Mechanics (Bird flies in wide circles across the sky, dipping and rising)
            let flightAngle = time * 0.4;
            let birdX = Math.cos(flightAngle) * flightRadius;
            let birdZ = Math.sin(flightAngle) * flightRadius;
            let birdY = 12 + Math.sin(time * 0.8) * 4; // Soaring altitude changes

            birdGroup.position.set(birdX, birdY, birdZ);
            birdGroup.rotation.y = -flightAngle - Math.PI / 2;
            birdGroup.rotation.z = Math.sin(time * 0.8) * 0.2; // banking turns

            // Flapping Wings Animation
            let flapSpeed = 12;
            leftWing.rotation.z = Math.sin(time * flapSpeed) * 0.6;
            rightWing.rotation.z = -Math.sin(time * flapSpeed) * 0.6;

            // Camera Handling
            if (isBirdPOV) {
                camera.position.copy(birdGroup.position).add(new THREE.Vector3(0, 0.5, 2));
                let lookTarget = birdGroup.position.clone().add(new THREE.Vector3(Math.cos(flightAngle)*10, 0, Math.sin(flightAngle)*10));
                camera.lookAt(lookTarget);
            } else {
                controls.update();
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
