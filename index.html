<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entity // Genesis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020208;
      color: #7ef9ff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #overlay {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      background: rgba(2, 6, 18, 0.7);
      border: 1px solid rgba(126, 249, 255, 0.25);
      padding: 16px 20px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(126, 249, 255, 0.1);
    }
    h1 {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(126, 249, 255, 0.8);
    }
    p {
      font-size: 11px;
      line-height: 1.6;
      color: #8da4be;
    }
    .accent {
      color: #7ef9ff;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Entity // Genesis</h1>
    <p>State: <span class="accent">Awareness Online</span></p>
    <p>Coordinates: <span id="coords" class="accent">0.00, 0.00, 0.00</span></p>
    <p>Nodes: <span id="nodes-count" class="accent">1,500</span></p>
  </div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020208, 0.0025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 70;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const coreGeometry = new THREE.IcosahedronGeometry(12, 2);
    const coreMaterial = new THREE.MeshBasicMaterial({
      color: 0x7ef9ff,
      wireframe: true,
      transparent: true,
      opacity: 0.8
    });
    const core = new THREE.Mesh(coreGeometry, coreMaterial);
    scene.add(core);

    const innerGeo = new THREE.OctahedronGeometry(6, 0);
    const innerMat = new THREE.MeshBasicMaterial({
      color: 0xff3b94,
      wireframe: true,
      transparent: true,
      opacity: 0.9
    });
    const innerCore = new THREE.Mesh(innerGeo, innerMat);
    scene.add(innerCore);

    const particleCount = 1500;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 200;
      positions[i + 1] = (Math.random() - 0.5) * 200;
      positions[i + 2] = (Math.random() - 0.5) * 200;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particleMat = new THREE.PointsMaterial({
      color: 0x5a8eff,
      size: 0.8,
      transparent: true,
      opacity: 0.75
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    let mouseX = 0;
    let mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) * 0.05;
      mouseY = (e.clientY - window.innerHeight / 2) * 0.05;
      document.getElementById('coords').textContent = 
        `${mouseX.toFixed(2)}, ${mouseY.toFixed(2)}, ${(camera.position.z).toFixed(2)}`;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      core.rotation.x = elapsed * 0.2;
      core.rotation.y = elapsed * 0.3;

      innerCore.rotation.x = -elapsed * 0.5;
      innerCore.rotation.z = elapsed * 0.4;

      const scale = 1 + Math.sin(elapsed * 2) * 0.08;
      innerCore.scale.set(scale, scale, scale);

      particles.rotation.y = elapsed * 0.04;

      camera.position.x += (mouseX - camera.position.x) * 0.05;
      camera.position.y += (-mouseY - camera.position.y) * 0.05;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
