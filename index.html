<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Chicken AI World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: monospace; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            max-height: 90vh;
            background: rgba(10, 10, 20, 0.94);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }
        h2 { margin: 0 0 10px 0; font-size: 15px; text-transform: uppercase; border-bottom: 1px solid #00ffcc; padding-bottom: 5px; }
        #status { font-size: 11px; color: #ff00ff; margin-bottom: 10px; }
        
        .btn {
            background: #00ffcc;
            color: #050510;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 11px;
        }
        .btn:hover { background: #00cc99; }

        #command-box {
            display: flex;
            margin-bottom: 10px;
        }
        #user-input {
            flex-grow: 1;
            background: #050510;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px;
            font-family: monospace;
            font-size: 11px;
            border-radius: 4px 0 0 4px;
            outline: none;
        }
        #send-btn {
            background: #00ffcc;
            color: #050510;
            border: none;
            padding: 6px 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            font-size: 11px;
        }
        #send-btn:hover { background: #00cc99; }

        #thought-log {
            overflow-y: auto;
            flex-grow: 1;
            max-height: 45vh;
            padding-right: 5px;
        }
        .thought-entry {
            background: rgba(0, 255, 204, 0.05);
            border-left: 2px solid #00ffcc;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.4;
            color: #d1d5db;
        }
        .thought-entry span { color: #00ffcc; font-weight: bold; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h2>MC Chicken Entity</h2>
        <div id="status">Status: Connecting...</div>
        <button class="btn" id="cam-toggle">Switch to Chicken POV</button>
        
        <div id="command-box">
            <input type="text" id="user-input" placeholder="Tell the chicken what to build or paint..." />
            <button id="send-btn">Send</button>
        </div>

        <div id="thought-log">Chicken mind waking up...</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.01);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(30, 60, 30);
        scene.add(sun);

        // Grid & Floor
        scene.add(new THREE.GridHelper(120, 60, 0x00ffcc, 0x16162c));
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(120, 120),
            new THREE.MeshStandardMaterial({ color: 0x070714, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- BUILD THE MINECRAFT CHICKEN ENTITY ---
        const chickenGroup = new THREE.Group();

        // Blocky MC White Body
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.0, 1.6), bodyMat);
        body.position.y = 1.0;
        chickenGroup.add(body);

        // Blocky MC Head
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), bodyMat);
        head.position.set(0, 1.7, 0.7);
        chickenGroup.add(head);

        // Orange Beak
        const beakMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
        const beak = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.4), beakMat);
        beak.position.set(0, 1.6, 1.15);
        chickenGroup.add(beak);

        // Red Wattle / Comb
        const redMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const comb = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.5), redMat);
        comb.position.set(0, 2.2, 0.7);
        chickenGroup.add(comb);

        // Yellow Blocky Legs
        const legGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
        const leftLeg = new THREE.Mesh(legGeo, beakMat);
        leftLeg.position.set(-0.35, 0.4, 0);
        chickenGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, beakMat);
        rightLeg.position.set(0.35, 0.4, 0);
        chickenGroup.add(rightLeg);

        scene.add(chickenGroup);
        chickenGroup.position.set(0, 0, 0);

        // Camera POV Mode Toggle
        let isChickenPOV = false;
        const camToggleBtn = document.getElementById('cam-toggle');
        camToggleBtn.addEventListener('click', () => {
            isChickenPOV = !isChickenPOV;
            camToggleBtn.innerText = isChickenPOV ? "Switch to Orbit Cam" : "Switch to Chicken POV";
            controls.enabled = !isChickenPOV;
        });

        // Command Box Handling
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        async function sendCommand() {
            let cmd = userInput.value.trim();
            if (!cmd) return;
            document.getElementById('status').innerText = "Status: Transmitting to MC chicken...";
            try {
                const res = await fetch('./agent_memory.json?_=' + new Date().getTime());
                let memory = await res.json();
                if (!memory.curiosity) memory.curiosity = [];
                memory.curiosity.unshift("USER REQUEST: " + cmd);
                if (!memory.history) memory.history = [];
                memory.history.push({ thought: "[CHICKEN INSTRUCTION]: " + cmd });
                userInput.value = "";
                document.getElementById('status').innerText = "Status: Chicken heard you!";
            } catch (err) {
                alert("Make sure local python server is running!");
            }
        }
        sendBtn.addEventListener('click', sendCommand);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendCommand(); });

        // Spawned World Objects
        const spawnedObjects = new Set();

        function spawnObject(data) {
            if (spawnedObjects.has(data.id)) return;
            spawnedObjects.add(data.id);

            let geo;
            if (data.shape === "box") geo = new THREE.BoxGeometry(data.size || 3, data.size || 3, data.size || 3);
            else if (data.shape === "cylinder") geo = new THREE.CylinderGeometry(1.5, 1.5, data.height || 4, 24);
            else geo = new THREE.SphereGeometry(2, 24, 24);

            let colorHex = parseInt(data.color) || 0x00ffcc;
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(data.x || 0, (data.size || 3)/2, data.z || 0);
            scene.add(mesh);
        }

        // Fetch Memory Live
        async function fetchAgentData() {
            try {
                const response = await fetch('./agent_memory.json?_=' + new Date().getTime());
                if (!response.ok) throw new Error();
                const memory = await response.json();

                document.getElementById('status').innerText = "Status: MC Chicken Wandering Active";

                const logDiv = document.getElementById('thought-log');
                logDiv.innerHTML = "";
                if (memory.history) {
                    memory.history.slice().reverse().forEach((entry, index) => {
                        const div = document.createElement('div');
                        div.className = 'thought-entry';
                        div.innerHTML = `<span>Cycle #${memory.history.length - index}</span>${entry.thought}`;
                        logDiv.appendChild(div);
                    });
                }

                if (memory.objects) {
                    memory.objects.forEach(obj => spawnObject(obj));
                }
            } catch (err) {
                document.getElementById('status').innerText = "Status: Connecting to chicken mind...";
            }
        }

        setInterval(fetchAgentData, 5000);
