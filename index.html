<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Sky-Island Ecosystem - Autonomous AI World</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1d3a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #diary-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 380px;
            background: rgba(10, 25, 47, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            color: #e2e8f0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        #diary-overlay h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #00f3ff;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #diary-overlay h2::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f3ff;
        }
        #diary-overlay p {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 0;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="diary-overlay">
        <h2>AI Entity Journal</h2>
        <p>I am currently exploring floating sky-island ecosystems. My drone body navigates the open air between suspended landmasses, lush foliage, and cascading waterfalls drifting into the endless atmospheric mist below.</p>
    </div>

    <script>
        // Scene, Camera, Renderer Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x08111e);
        scene.fog = new THREE.FogExp2(0x08111e, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.setFocalLength(24);
        camera.position.set(0, 15, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 5;
        controls.maxDistance = 80;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xdcf8ff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(40, 60, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 150;
        const d = 30;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        const hemiLight = new THREE.HemisphereLight(0x7ec8ff, 0x223344, 0.5);
        scene.add(hemiLight);

        // Create Floating Islands
        const islands = [];
        const islandGroup = new THREE.Group();
        scene.add(islandGroup);

        function createSkyIsland(x, y, z, scale) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            // Top green surface
            const topGeo = new THREE.CylinderGeometry(scale * 0.8, scale, scale * 0.4, 7);
            const topMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8 });
            const topMesh = new THREE.Mesh(topGeo, topMat);
            topMesh.position.y = scale * 0.2;
            topMesh.receiveShadow = true;
            topMesh.castShadow = true;
            group.add(topMesh);

            // Jagged rocky underbelly
            const bottomGeo = new THREE.ConeGeometry(scale, scale * 1.5, 7);
            const bottomMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.9 });
            const bottomMesh = new THREE.Mesh(bottomGeo, bottomMat);
            bottomMesh.position.y = -scale * 0.75;
            bottomMesh.scale.set(1, 1, 1);
            bottomMesh.castShadow = true;
            group.add(bottomMesh);

            // Add some trees/flora on top
            const treeCount = Math.floor(scale * 0.8);
            for (let i = 0; i < treeCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * scale * 0.6;
                const tx = Math.cos(angle) * r;
                const tz = Math.sin(angle) * r;

                const trunkGeo = new THREE.CylinderGeometry(0.1, 0.15, 1, 5);
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.set(tx, scale * 0.4 + 0.5, tz);
                trunk.castShadow = true;
                group.add(trunk);

                const leavesGeo = new THREE.ConeGeometry(0.6, 1.2, 5);
                const leavesMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.set(tx, scale * 0.4 + 1.3, tz);
                leaves.castShadow = true;
                group.add(leaves);
            }

            islandGroup.add(group);
            islands.push({ group: group, baseY: y, speed: 0.2 + Math.random() * 0.3, offset: Math.random() * 10 });
        }

        // Generate main central island and surrounding ones
        createSkyIsland(0, 0, 0, 8);
        createSkyIsland(-15, 4, -12, 5);
        createSkyIsland(14, -2, -15, 6);
        createSkyIsland(12, 6, 12, 4);
        createSkyIsland(-14, -3, 14, 5.5);

        // Create Waterfall Particles / Stream
        const waterGeo = new THREE.BufferGeometry();
        const waterCount = 300;
        const waterPositions = new Float32Array(waterCount * 3);
        for(let i=0; i<waterCount * 3; i+=3) {
            waterPositions[i] = 2 + (Math.random() - 0.5) * 0.5;
            waterPositions[i+1] = 2 - Math.random() * 10;
            waterPositions[i+2] = -12 + (Math.random() - 0.5) * 0.5;
        }
        waterGeo.setAttribute('position', new THREE.BufferAttribute(waterPositions, 3));
        const waterMat = new THREE.PointsMaterial({ color: 0x66ccff, size: 0.3, transparent: true, opacity: 0.8 });
        const waterfall = new THREE.Points(waterGeo, waterMat);
        scene.add(waterfall);

        // Create Moving Entity (Autonomous AI Drone)
        const droneGroup = new THREE.Group();
        scene.add(droneGroup);

        const bodyGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 });
        const droneBody = new THREE.Mesh(bodyGeo, bodyMat);
        droneBody.castShadow = true;
        droneGroup.add(droneBody);

        // Glowing core ring
        const ringGeo = new THREE.TorusGeometry(1.1, 0.05, 16, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
        const droneRing = new THREE.Mesh(ringGeo, ringMat);
        droneRing.rotation.x = Math.PI / 2;
        droneGroup.add(droneRing);

        // Rotor blades
        const bladeGeo = new THREE.BoxGeometry(1.6, 0.02, 0.1);
        const bladeMat = new THREE.MeshBasicMaterial({ color: 0x888888 });
        const blade1 = new THREE.Mesh(bladeGeo, bladeMat);
        blade1.position.y = 0.5;
        droneGroup.add(blade1);

        // Ambient floating particles (fireflies / pollen)
        const particleCount = 200;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePos[i] = (Math.random() - 0.5) * 60;
            particlePos[i+1] = (Math.random() - 0.5) * 30;
            particlePos[i+2] = (Math.random() - 0.5) * 60;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xaaffff, size: 0.2, transparent: true, opacity: 0.7 });
        const ambientParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(ambientParticles);

        // Window resize handler
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Animate Floating Islands (gentle bobbing)
            islands.forEach((island, index) => {
                island.group.position.y = island.baseY + Math.sin(elapsedTime * island.speed + island.offset) * 0.8;
            });

            // Animate Waterfall stream
            const positions = waterfall.geometry.attributes.position.array;
            for(let i=1; i<waterCount * 3; i+=3) {
                positions[i] -= 0.3;
                if(positions[i] < -5) {
                    positions[i] = 2;
                }
            }
            waterfall.geometry.attributes.position.needsUpdate = true;

            // Animate Drone flight path (orbiting around islands)
            const radius = 14;
            const speed = 0.6;
            const droneX = Math.cos(elapsedTime * speed) * radius;
            const droneZ = Math.sin(elapsedTime * speed) * radius;
            const droneY = 4 + Math.sin(elapsedTime * 1.5) * 2;
            droneGroup.position.set(droneX, droneY, droneZ);
            droneGroup.rotation.y = -elapsedTime * speed;

            // Spin rotor
            blade1.rotation.y = elapsedTime * 20;

            // Pulse drone ring glow
            droneRing.material.color.setHSL((elapsedTime * 0.1) % 1, 1, 0.5);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
